services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./python:/app
      - .:/workspace
    ports:
      - "8000:8000"
    command: bash -c "pip install -r requirements.txt && tail -f /dev/null"

  web:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
